name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sbo-rebirth-planner/package-lock.json

      - name: Install planner deps and rebuild SpacetimeDB client bundle
        working-directory: sbo-rebirth-planner
        run: npm ci && npm run build:stdb-client

      - name: Validate wiki sync report thresholds
        working-directory: sbo-rebirth-planner
        run: npm run validate:wiki-sync

      - name: Run planner smoke tests
        working-directory: sbo-rebirth-planner
        run: |
          npx serve -p 60290 -l 60290 > /tmp/planner-serve.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          npm test
          kill $SERVER_PID

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sbo-rebirth-planner

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
