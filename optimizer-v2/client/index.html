<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d11" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>SBO:Rebirth Build Optimizer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function restoreGitHubPagesRoute(location) {
        if (!location.search.startsWith('?/')) return;
        var route = location.search
          .slice(2)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(
          null,
          '',
          location.pathname.replace(/\/$/, '') + '/' + route + location.hash,
        );
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
